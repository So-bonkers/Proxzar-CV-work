<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocLing with API</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="/static/css/custom.css" />
  </head>
  <body class="container mt-5">
    <h1 class="text-center">Document Processing</h1>

    <!-- Ingest via Path Form -->
    <h2>Ingest via Path</h2>
    <form id="ingestPathForm" enctype="multipart/form-data">
      <div class="mb-3">
        <label for="file" class="form-label">Choose File</label>
        <input
          type="file"
          class="form-control"
          id="file"
          name="file"
          required
        />
      </div>
      <button type="submit" class="btn btn-primary">Ingest via Path</button>
    </form>

    <!-- Ingest via Link Form -->
    <h2 class="mt-5">Ingest via Link</h2>
    <form id="ingestLinkForm">
      <div class="mb-3">
        <label for="fileLink" class="form-label">Enter File Link</label>
        <input
          type="url"
          class="form-control"
          id="fileLink"
          name="fileLink"
          placeholder="https://example.com/document.pdf"
          required
        />
      </div>
      <button type="submit" class="btn btn-secondary">Ingest via Link</button>
    </form>

    <!-- NEW: Ingest via Stream Form -->
    <h2 class="mt-5">Ingest via Stream and Convert on the Fly</h2>
    <form id="ingestStreamForm">
      <div class="mb-3">
        <label for="bucketName" class="form-label">S3 Bucket Name</label>
        <input
          type="text"
          class="form-control"
          id="bucketName"
          name="bucketName"
          placeholder="your-bucket-name"
          required
        />
      </div>
      <div class="mb-3">
        <label for="fileKey" class="form-label">File Key</label>
        <input
          type="text"
          class="form-control"
          id="fileKey"
          name="fileKey"
          placeholder="path/to/your/file.pdf"
          required
        />
      </div>
      <button type="submit" class="btn btn-info">Ingest via Stream</button>
    </form>

    <div id="ingestResult" class="mt-3"></div>

    <!-- Extract Section -->
    <h2 class="mt-5">Extract Content</h2>
    <form id="extractForm">
      <div class="mb-3">
        <label for="client_id" class="form-label">Client ID</label>
        <input
          type="text"
          class="form-control"
          id="client_id"
          name="client_id"
          required
        />
      </div>
      <button type="submit" class="btn btn-success">Extract</button>
    </form>
    <div id="extractResult" class="mt-3"></div>

    <!-- HTML to JSON Converter Section -->
    <h2 class="mt-5">HTML to JSON Converter (Deprecated)</h2>
    <form id="htmlToJsonForm">
      <div class="mb-3">
        <label for="client_id_html" class="form-label">Client ID</label>
        <input
          type="text"
          class="form-control"
          id="client_id_html"
          name="client_id_html"
          required
        />
      </div>
      <button type="submit" class="btn btn-warning">
        Convert HTML to JSON
      </button>
    </form>
    <div id="htmlToJsonResult" class="mt-3"></div>

    <!-- JSON Conversion Section -->
    <h2 class="mt-5">JSON Conversion</h2>
    <form id="jsonConversionForm">
      <div class="mb-3">
        <label for="json_client_id" class="form-label">Client ID</label>
        <input
          type="text"
          class="form-control"
          id="json_client_id"
          name="json_client_id"
          required
        />
      </div>
      <button type="submit" class="btn btn-primary">
        Convert to Simplified JSON
      </button>
    </form>
    <div id="jsonConversionResult" class="mt-3"></div>

    <script src="/static/js/custom.js"></script>
  </body>
</html>
