<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Processing</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h1 class="text-center">Document Processing</h1>

    <!-- Ingest Section -->
    <h2>Ingest Document</h2>
    <form id="ingestForm" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="file" class="form-label">Choose File</label>
            <input type="file" class="form-control" id="file" name="file" required>
        </div>
        <button type="submit" class="btn btn-primary">Ingest</button>
    </form>
    <div id="ingestResult" class="mt-3"></div>

    <!-- Extract Section -->
    <h2 class="mt-5">Extract Content</h2>
    <form id="extractForm">
        <div class="mb-3">
            <label for="client_id" class="form-label">Client ID</label>
            <input type="text" class="form-control" id="client_id" name="client_id" required>
        </div>
        <button type="submit" class="btn btn-success">Extract</button>
    </form>
    <div id="extractResult" class="mt-3"></div>

    <script>
        document.getElementById('ingestForm').onsubmit = async function (e) {
            e.preventDefault();
            const formData = new FormData(this);
            const res = await fetch('/api/v1/ingest', { method: 'POST', body: formData });
            const data = await res.json();
            document.getElementById('ingestResult').innerHTML = `
                <p>Client ID: <strong>${data.client_id}</strong></p>
                <p>Output Path: <code>${data.output_path}</code></p>
            `;
        };

        document.getElementById('extractForm').onsubmit = async function (e) {
            e.preventDefault();
            const formData = new FormData(this);
            const res = await fetch('/api/v1/extract', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.files) {
                document.getElementById('extractResult').innerHTML = `
                    <p>Files extracted:</p>
                    <ul>${data.files.map(file => `<li>${file}</li>`).join('')}</ul>
                `;
            } else {
                document.getElementById('extractResult').innerHTML = `<p>${data.error}</p>`;
            }
        };
    </script>
</body>
</html>
