<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WearWatcher - Image Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }
        .container {
            width: 50%;
            margin: 20px auto;
            background: white;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        input, button, select {
            margin: 10px 0;
            padding: 10px;
            width: 90%;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-img {
            margin-top: 20px;
            max-width: 80%;
            border: 2px solid #ddd;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>WearWatcher - Image Search</h2>

        <h3>1️⃣ Load Multiple Clients</h3>
        <input type="text" id="client_ids" placeholder="Enter comma-separated client IDs">
        <button onclick="loadMultipleClients()">Load Clients</button>

        <h3>2️⃣ Select a Client</h3>
        <select id="selected_client">
            <option value="">-- Select a Loaded Client --</option>
        </select>

        <h3>3️⃣ Add New Image to Index</h3>
        <input type="file" id="add_image">
        <button onclick="addImageToIndex()">Upload & Index Image</button>

        <h3>4️⃣ Search for Similar Images</h3>
        <input type="file" id="search_image">
        <button onclick="getSimilarImages()">Find Similar</button>

        <h3>Results:</h3>
        <img id="resultImage" class="result-img" style="display: none;" alt="Similar Images">
    </div>

    <script>
        const API_URL = "http://127.0.0.1:5000/api/v1"; // Update if needed

        async function loadMultipleClients() {
    const client_ids = document.getElementById("client_ids").value.split(",").map(id => id.trim());

    if (client_ids.length === 0 || client_ids[0] === "") {
        alert("Please enter at least one client ID.");
        return;
    }

    const response = await fetch(`${API_URL}/runIndexWithExistingImagesOnServer`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },  // Fix: Explicitly set JSON type
        body: JSON.stringify({ client_ids })
    });

    const data = await response.json();
    alert(data.message || data.error);

    if (data.newly_loaded.length > 0) {
        const select = document.getElementById("selected_client");
        data.newly_loaded.forEach(client_id => {
            let option = document.createElement("option");
            option.value = client_id;
            option.textContent = client_id;
            select.appendChild(option);
        });
    }
}


        async function addImageToIndex() {
            const client_id = document.getElementById("selected_client").value;
            const file = document.getElementById("add_image").files[0];

            if (!client_id) {
                alert("Please select a client.");
                return;
            }

            if (!file) {
                alert("Please select an image to upload.");
                return;
            }

            const formData = new FormData();
            formData.append("client_id", client_id);
            formData.append("file", file);

            const response = await fetch(`${API_URL}/addNewImageToIndex`, { method: "POST", body: formData });
            const data = await response.json();
            alert(data.message || data.error);
        }

        async function getSimilarImages() {
            const client_id = document.getElementById("selected_client").value;
            const file = document.getElementById("search_image").files[0];

            if (!client_id) {
                alert("Please select a client.");
                return;
            }

            if (!file) {
                alert("Please select an image to search.");
                return;
            }

            const formData = new FormData();
            formData.append("client_id", client_id);
            formData.append("file", file);

            const response = await fetch(`${API_URL}/getSimilarImages`, { method: "POST", body: formData });

            if (!response.ok) {
                alert("Error processing request.");
                return;
            }

            // Set the result image source to the returned plot image
            const resultImage = document.getElementById("resultImage");
            resultImage.src = URL.createObjectURL(await response.blob());
            resultImage.style.display = "block";
        }
    </script>

</body>
</html>
