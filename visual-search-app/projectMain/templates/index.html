<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Search App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }
        .container {
            width: 50%;
            margin: 20px auto;
            background: white;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        input, button {
            margin: 10px 0;
            padding: 10px;
            width: 90%;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-img {
            margin-top: 20px;
            max-width: 80%;
            border: 2px solid #ddd;
            border-radius: 10px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Image Search</h2>

        <label for="client_id">Client ID:</label>
        <input type="text" id="client_id" placeholder="Enter client ID">

        <h3>1️⃣ Create Index</h3>
        <label for="folder_path">Folder Path:</label>
        <input type="text" id="folder_path" placeholder="Enter folder path">
        <button onclick="makeIndex()">Create Index</button>

        <h3>2️⃣ Load Existing Index</h3>
        <button onclick="loadIndex()">Load Index</button>

        <h3>3️⃣ Add New Image to Index</h3>
        <input type="file" id="add_image" accept="image/*">
        <button onclick="addImageToIndex()">Upload & Index Image</button>

        <h3>4️⃣ Search for Similar Images</h3>
        <input type="file" id="search_image" accept="image/*">
        <button onclick="getSimilarImages()">Find Similar</button>

        <h3>Results:</h3>
        <img id="resultImage" class="result-img" style="display: none;" alt="Similar Images">
    </div>

    <script>
        const API_URL = "http://127.0.0.1:5000/api/v1"; // Update if needed

        async function makeIndex() {
            const client_id = document.getElementById("client_id").value;
            const folder_path = document.getElementById("folder_path").value;

            if (!client_id || !folder_path) {
                alert("Please enter both Client ID and Folder Path");
                return;
            }

            const formData = new FormData();
            formData.append("client_id", client_id);
            formData.append("path", folder_path);

            const response = await fetch(`${API_URL}/makeIndex`, { method: "POST", body: formData });
            const data = await response.json();
            alert(data.message || data.error);
        }

        async function loadIndex() {
            const client_id = document.getElementById("client_id").value;

            if (!client_id) {
                alert("Please enter Client ID");
                return;
            }

            const formData = new FormData();
            formData.append("client_id", client_id);

            const response = await fetch(`${API_URL}/runIndexWithExistingImagesOnServer`, { method: "POST", body: formData });
            const data = await response.json();
            alert(data.message || data.error);
        }

        async function addImageToIndex() {
            const client_id = document.getElementById("client_id").value;
            const file = document.getElementById("add_image").files[0];

            if (!client_id || !file) {
                alert("Please select a file and enter Client ID");
                return;
            }

            const formData = new FormData();
            formData.append("client_id", client_id);
            formData.append("file", file);

            const response = await fetch(`${API_URL}/addNewImageToIndex`, { method: "POST", body: formData });
            const data = await response.json();
            alert(data.message || data.error);
        }

        async function getSimilarImages() {
            const client_id = document.getElementById("client_id").value;
            const file = document.getElementById("search_image").files[0];

            if (!client_id || !file) {
                alert("Please select a file and enter Client ID");
                return;
            }

            const formData = new FormData();
            formData.append("client_id", client_id);
            formData.append("file", file);

            const response = await fetch(`${API_URL}/getSimilarImages`, { method: "POST", body: formData });

            if (!response.ok) {
                alert("Error processing request.");
                return;
            }

            // Set the result image source to the returned plot image
            const resultImage = document.getElementById("resultImage");
            resultImage.src = URL.createObjectURL(await response.blob());
            resultImage.style.display = "block";
        }
    </script>

</body>
</html>
