<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }
        .container {
            width: 50%;
            margin: 20px auto;
            background: white;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        input, button {
            margin: 10px 0;
            padding: 10px;
            width: 90%;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .results {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }
        .image-box {
            width: 150px;
            margin: 10px;
            border: 2px solid #ddd;
            padding: 5px;
            background: white;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
        }
        img {
            width: 100%;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Image Search API</h2>

        <label for="client_id">Client ID:</label>
        <input type="text" id="client_id" placeholder="Enter client ID">

        <h3>Upload Image for Similar Search</h3>
        <input type="file" id="search_image" accept="image/*">
        <button onclick="getSimilarImages()">Find Similar</button>

        <h3>Results:</h3>
        <div class="results" id="results"></div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:5000/api/v1"; // Update if needed

        async function getSimilarImages() {
            const client_id = document.getElementById("client_id").value;
            const file = document.getElementById("search_image").files[0];

            if (!client_id || !file) {
                alert("Please select a file and enter Client ID");
                return;
            }

            const formData = new FormData();
            formData.append("client_id", client_id);
            formData.append("file", file);

            const response = await fetch(`${API_URL}/getSimilarImages`, { method: "POST", body: formData });
            const data = await response.json();

            if (data.error) {
                alert(data.error);
                return;
            }

            displayResults(data.similar_images);
        }

        function displayResults(images) {
            const resultsDiv = document.getElementById("results");
            resultsDiv.innerHTML = ""; // Clear previous results

            images.forEach(imgPath => {
                const imgBox = document.createElement("div");
                imgBox.className = "image-box";

                const imgElement = document.createElement("img");
                imgElement.src = imgPath;
                imgElement.alt = "Similar Image";

                imgBox.appendChild(imgElement);
                resultsDiv.appendChild(imgBox);
            });
        }
    </script>

</body>
</html>
