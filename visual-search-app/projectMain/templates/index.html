<!DOCTYPE html>
<html>
<head>
    <title>Visual Search App API Tester</title>
    <script src="https://cdn.jsdelivr.net/npm/dropzone@5.9.3/dist/min/dropzone.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dropzone@5.9.3/dist/min/dropzone.min.css" type="text/css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }
        .container {
            width: 50%;
            margin: 20px auto;
            background: white;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        input, button {
            margin: 10px 0;
            padding: 10px;
            width: 90%;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .results {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }
        .image-box {
            width: 150px;
            margin: 10px;
            border: 2px solid #ddd;
            padding: 5px;
            background: white;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
        }
        img {
            width: 100%;
            border-radius: 5px;
        }
        #response {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            background-color: #eef;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Visual Search App API Tester</h2>

        <label for="client_id">Client ID:</label>
        <input type="text" id="client_id" placeholder="Enter client ID">

        <h3>1. Create Index</h3>
        <label for="folder_path">Folder Path:</label>
        <input type="text" id="folder_path" placeholder="Enter folder path">
        <button onclick="makeIndex()">Create Index</button>

        <h3>2. Load Index</h3>
        <button onclick="loadIndex()">Load Index</button>

        <h3>3. Add Image to Index</h3>
        <form action="/api/v1/addNewImageToIndex" class="dropzone" id="addImageDropzone"></form>

        <h3>4. Search Similar Images</h3>
        <form action="/api/v1/getSimilarImages" class="dropzone" id="searchImageDropzone"></form>

        <h3>API Response:</h3>
        <div id="response"></div>

        <h3>Results:</h3>
        <div class="results" id="results"></div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:5000/api/v1"; // Update with your server URL if needed

        async function makeIndex() {
            const client_id = document.getElementById("client_id").value;
            const folder_path = document.getElementById("folder_path").value;

            if (!client_id || !folder_path) {
                alert("Please enter both Client ID and Folder Path");
                return;
            }

            const formData = new FormData();
            formData.append("client_id", client_id);
            formData.append("path", folder_path);

            const response = await fetch(`${API_URL}/makeIndex`, { method: "POST", body: formData });
            const data = await response.json();
            document.getElementById("response").innerText = JSON.stringify(data, null, 2);
        }

        async function loadIndex() {
            const client_id = document.getElementById("client_id").value;

            if (!client_id) {
                alert("Please enter Client ID");
                return;
            }

            const formData = new FormData();
            formData.append("client_id", client_id);

            const response = await fetch(`${API_URL}/runIndexWithExistingImagesOnServer`, { method: "POST", body: formData });
            const data = await response.json();
            document.getElementById("response").innerText = JSON.stringify(data, null, 2);
        }

        Dropzone.options.addImageDropzone = {
            paramName: "file",
            maxFilesize: 10,
            acceptedFiles: "image/*",
            init: function() {
                this.on("sending", function(file, xhr, formData) {
                    const client_id = document.getElementById("client_id").value;
                    if (!client_id) {
                        alert("Please enter Client ID before uploading!");
                        this.removeFile(file);
                        return;
                    }
                    formData.append("client_id", client_id);
                });
                this.on("success", function(file, response) {
                    document.getElementById("response").innerText = JSON.stringify(response, null, 2);
                });
            }
        };

        Dropzone.options.searchImageDropzone = {
            paramName: "file",
            maxFilesize: 10,
            acceptedFiles: "image/*",
            init: function() {
                this.on("sending", function(file, xhr, formData) {
                    const client_id = document.getElementById("client_id").value;
                    if (!client_id) {
                        alert("Please enter Client ID before searching!");
                        this.removeFile(file);
                        return;
                    }
                    formData.append("client_id", client_id);
                });
                this.on("success", function(file, response) {
                    document.getElementById("response").innerText = JSON.stringify(response, null, 2);
                    displayResults(response.similar_images);
                });
            }
        };

        function displayResults(images) {
            const resultsDiv = document.getElementById("results");
            resultsDiv.innerHTML = ""; // Clear previous results

            images.forEach(imgPath => {
                const imgBox = document.createElement("div");
                imgBox.className = "image-box";

                const imgElement = document.createElement("img");
                imgElement.src = imgPath;
                imgElement.alt = "Similar Image";

                imgBox.appendChild(imgElement);
                resultsDiv.appendChild(imgBox);
            });
        }
    </script>

</body>
</html>
